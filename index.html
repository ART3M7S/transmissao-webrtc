<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transmissão com Consentimento</title>
<style>
  body { font-family: Arial, sans-serif; background: #111; color: #fff; text-align: center; padding: 20px; }
 .container { max-width: 900px; margin: auto; }
  video { width: 100%; max-width: 600px; background: #000; border-radius: 12px; border: 2px solid #00ff88; }
  button { padding: 12px 24px; margin: 10px; border: none; border-radius: 8px; background: #00ff88; color: #000; font-weight: bold; cursor: pointer; font-size: 16px; }
  input { padding: 10px; border-radius: 6px; border: none; margin: 5px; width: 80%; max-width: 300px; }
 .hidden { display: none; }
  #loginBox, #senderBox, #receiverBox { background: #222; padding: 20px; border-radius: 12px; margin-top: 20px; }
  #linkSala { word-break: break-all; color: #00ff88; }
</style>
</head>
<body>
<div class="container">
  <h1>Transmissão Ao Vivo</h1>

  <!-- LADO 1: LOGIN + MONITOR -->
  <div id="loginBox">
    <h2>Lado 1 - Monitor</h2>
    <input type="text" id="usuario" placeholder="Usuário">
    <input type="password" id="senha" placeholder="Senha">
    <button onclick="fazerLogin()">Entrar</button>
  </div>

  <div id="receiverBox" class="hidden">
    <h2>Monitor: Visualizando Lado 2</h2>
    <p>Compartilhe este link com Lado 2:</p>
    <b id="linkSala"></b>
    <video id="remoteVideo" autoplay playsinline></video>
    <p id="status">Aguardando Lado 2 entrar...</p>
  </div>

  <!-- LADO 2: ENVIAR -->
  <div id="senderBox" class="hidden">
    <h2>Lado 2 - Enviar Câmera</h2>
    <p><b>Você está compartilhando sua câmera com o monitor</b></p>
    <video id="localVideo" autoplay muted playsinline></video>
    <button onclick="iniciarCamera()">Liberar Câmera e Transmitir</button>
    <p id="senderStatus"></p>
  </div>

</div>

<!-- Biblioteca do socket.io vem do próprio servidor -->
<script src="/socket.io/socket.io.js"></script>
<script>
// Config WebRTC
const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
let pc, localStream;
const socket = io(); // conecta no mesmo servidor que hospeda o HTML
let salaAtual = '';

// Detecta se é Lado 2 pelo link
const params = new URLSearchParams(window.location.search);
const ehLado2 = params.get('lado') === '2';

if(ehLado2) {
  document.getElementById('loginBox').classList.add('hidden');
  document.getElementById('senderBox').classList.remove('hidden');
  salaAtual = params.get('sala');
  socket.emit('entrar-sala', salaAtual);
}

// LADO 1: LOGIN
function fazerLogin() {
  const user = document.getElementById('usuario').value;
  const pass = document.getElementById('senha').value;
  if(user && pass) {
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('receiverBox').classList.remove('hidden');
    salaAtual = Math.random().toString(36).substring(2,8);
    document.getElementById('linkSala').innerText = window.location.href.split('?')[0] + '?sala=' + salaAtual + '&lado=2';
    socket.emit('entrar-sala', salaAtual);
    iniciarComoReceptor();
  } else {
    alert('Preencha usuário e senha');
  }
}

// LADO 2: Pede permissão e liga a câmera
async function iniciarCamera() {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    document.getElementById('localVideo').srcObject = localStream;
    document.getElementById('senderStatus').innerText = 'Câmera liberada. Transmitindo...';
    iniciarComoEmissor();
  } catch(err) {
    alert('Erro ao acessar câmera: ' + err.message);
  }
}

// LADO 2: Cria oferta e envia pro Lado 1
async function iniciarComoEmissor() {
  pc = new RTCPeerConnection(config);
  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

  pc.onicecandidate = e => {
    if(e.candidate) socket.emit('candidate', {candidate: e.candidate, sala: salaAtual});
  };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  socket.emit('offer', {offer, sala: salaAtual});
}

// LADO 1: Recebe vídeo do Lado 2
async function iniciarComoReceptor() {
  pc = new RTCPeerConnection(config);
  pc.ontrack = e => {
    document.getElementById('remoteVideo').srcObject = e.streams[0];
    document.getElementById('status').innerText = 'Conectado! Recebendo vídeo...';
  };
  pc.onicecandidate = e => {
    if(e.candidate) socket.emit('candidate', {candidate: e.candidate, sala: salaAtual});
  };
}

// SINALIZAÇÃO VIA SOCKET.IO
socket.on('usuario-entrou', () => {
  document.getElementById('status').innerText = 'Lado 2 entrou. Aguardando vídeo...';
});

socket.on('offer', async data => {
  await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  socket.emit('answer', {answer, sala: salaAtual});
});

socket.on('answer', async data => {
  await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
});

socket.on('candidate', async data => {
  try{
    await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
  }catch(e){
    console.log('Erro ICE:', e)
  }
});
</script>
</body>
</html>
